repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.0
    hooks:
      - id: terraform_trivy
      - id: terraform_tflint

  - repo: https://github.com/bridgecrewio/checkov.git
    rev: 3.2.268
    hooks:
      - id: checkov
        language_version: /Users/ihebbesbes/.pyenv/versions/3.12.9/bin/python3.12   # homebrew python 3.15 has a broken pyexpat (see session notes); pyenv 3.13 is stable
        args: [--quiet, --skip-check, "CKV_K8S_15,CKV_K8S_22,CKV_K8S_23,CKV_K8S_40,CKV_K8S_43"]
        # Documented k8s skips (enumerated, justified — never blanket):
        #   CKV_K8S_15 IfNotPresent is intentional (pinned versions, node/PVC cache)
        #   CKV_K8S_22 vendor images require writable fs (model/cache state)
        #   CKV_K8S_23 vendor images run as root by design
        #   CKV_K8S_40 vendor images run as root by design (no high-UID variant)
        #   CKV_K8S_43 tags pinned in versions.lock (no latest); digests deferred
        # Terraform suppressions live inline in the tf files
        # (# checkov:skip=CKV_GCP_XX: reason). Rules of engagement in AGENTS.md.

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck (brew binary; shellcheck-py wheel fails to build here)
        entry: /opt/homebrew/bin/shellcheck --severity=warning
        language: system
        types: [shell]
      - id: boundary-check
        name: public-exposure boundary guard
        entry: scripts/check-boundary.sh
        language: script
        pass_filenames: false

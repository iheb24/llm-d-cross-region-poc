# CKV2_K8S_6: default-deny ingress in llmd-serving, then explicit allows for the
# documented flows (gateway -> EPP/pods, EPP <-> pods, Prometheus scrapes, DNS).
# Egress is left unrestricted (HF downloads, hub -> spokes, telemetry).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llmd-serving-default-deny-ingress
  namespace: llmd-serving
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llmd-serving-allow-intra-namespace
  namespace: llmd-serving
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llmd-serving-allow-gateway-and-monitoring
  namespace: llmd-serving
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gmp-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 8000
          protocol: TCP
        - port: 9002
          protocol: TCP
        - port: 9090
          protocol: TCP
        - port: 30090
          protocol: TCP

# Environment A inference endpoints: 2 x llm-d-inference-sim (pinned v1.0.0).
# Serves the OpenAI API with simulated latency (TTFT/ITL) and vLLM-like metrics.
# Model name is a deliberate Env-A placeholder ("llmd-poc-sim"): functional
# routing tests do not depend on model identity; the pinned real model arrives
# in Env B (P5). No render sidecar -> simulated tokenizer, zero external deps.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmd-sim
  namespace: llmd-serving
  labels:
    app: llmd-sim
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llmd-sim
  template:
    metadata:
      labels:
        app: llmd-sim
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm-sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0
          imagePullPolicy: IfNotPresent
          args:
            - "--model"
            - "llmd-poc-sim"
            - "--port"
            - "8000"
            # default context window is 1024 — T6's several-thousand-token
            # prefixes need headroom (sim config: max-model-len)
            - "--max-model-len=8192"
            - "--served-model-name"
            - "llmd-poc-sim"
            - "--served-model-name"
            - "Qwen/Qwen2.5-Coder-14B-Instruct-AWQ"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: llmd-sim
  namespace: llmd-serving
  labels:
    app: llmd-sim
spec:
  selector:
    app: llmd-sim
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP

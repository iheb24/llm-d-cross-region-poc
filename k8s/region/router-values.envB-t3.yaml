# T3 variant (US regional EPP): induces measurable queueing for the overflow
# test. flowControl is OFF BY DEFAULT in v1.0.0 (feature gate) — v1..v5 runs
# proved ungated configs never queue. Here: gate on, queue capacity 16,
# dispatch ceiling = 0.25 x 16 = 4 -> 12 workers overflow the queue.
# REVERTED to router-values.envB.yaml after the T3 run.
provider:
  name: none

httpRoute:
  create: true
  inferenceGatewayName: llm-d-inference-gateway
  requestTimeout: "300s"

router:
  modelServers:
    type: vllm
    protocol: http
    targetPorts:
      - number: 8000
    matchLabels:
      app: llmd-vllm

  inferencePool:
    create: true
    failureMode: FailOpen

  monitoring:
    provider:
      name: gmp
      gmp:
        autopilot: false
    interval: "15s"
    prometheus:
      enabled: true
      auth:
        enabled: false

  epp:
    replicas: 1
    image:
      tag: "v1.0.0"
    resources:
      requests:
        cpu: "500m"
        memory: 1Gi
      limits:
        memory: 2Gi
    flags:
      v: 2
      emit-endpoint-scores: true
      allow-experimental-plugins: true
    pluginsConfig:
      apiVersion: llm-d.ai/v1
      kind: EndpointPickerConfig
      featureGates: ["flowControl"]
      plugins:
        - type: queue-scorer
        - type: kv-cache-utilization-scorer
        - type: prefix-cache-scorer
        - type: session-affinity-filter
        - type: metrics-data-source
          parameters:
            scheme: http
            path: /metrics
            insecureSkipVerify: true
        - type: core-metrics-extractor
        - type: weighted-random-picker
        - type: single-profile-handler
      flowControl:
        # T3 v10: per-band concurrent cap 4 for default priority; 12 workers ->
        # ~8 queued at the regional EPP -> llm_d_epp_average_queue_size rises ->
        # hub queue-scorer overflows to EU. Reverted after the run.
        maxRequests: 16
        priorityBands:
          - priority: 0
            maxRequests: 4
      schedulingProfiles:
        - name: default
          plugins:
            - pluginRef: queue-scorer
              weight: 2
            - pluginRef: kv-cache-utilization-scorer
              weight: 2
            - pluginRef: prefix-cache-scorer
              weight: 3
            - pluginRef: session-affinity-filter

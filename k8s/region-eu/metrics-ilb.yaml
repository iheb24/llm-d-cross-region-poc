# EU: expose the regional EPP's /metrics to the hub cluster via a VPC-internal
# LoadBalancer (both clusters share llmd-poc-vpc; subnet ranges are routable).
# Env-A telemetry boundary (B3): network-contained, no auth — mTLS client-cert
# hardening is deferred (tracked in docs/results/p4 backlog).
apiVersion: v1
kind: Service
metadata:
  name: llmd-router-epp-metrics-ilb
  namespace: llmd-serving
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
    # ILB VIPs are region-local by default; the hub scrapes cross-region,
    # so the metrics VIP must be reachable from the other cluster's region.
    networking.gke.io/internal-load-balancer-global-access: "true"
spec:
  type: LoadBalancer
  loadBalancerIP: 10.10.0.100
  selector:
    llm-d-router-gateway: llmd-router-epp
  ports:
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: 9090

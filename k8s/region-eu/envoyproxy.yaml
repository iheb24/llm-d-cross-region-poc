# EU: bind the regional gateway's Envoy Service to the reserved static IP.
# On GKE, Gateway spec.addresses is translated to Service externalIPs, which GKE
# admission control denies. Instead: patch the generated Service with
# loadBalancerIP via an EnvoyProxy attached to the GatewayClass.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: poc-proxy-config
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        patch:
          type: StrategicMerge
          value:
            spec:
              loadBalancerIP: 34.34.96.149
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-ai-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: poc-proxy-config
    namespace: envoy-gateway-system

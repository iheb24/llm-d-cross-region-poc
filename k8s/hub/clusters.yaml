# Hub discovery file — regional gateways as cluster endpoints (P4 live values).
# Mounted into the hub EPP at /etc/epp/clusters.yaml via ConfigMap
# (k8s/hub/clusters-configmap.yaml); watchFile: true hot-reloads edits.
# address = regional gateway data plane (hub forwards requests here).
# metricsAddress/metricsPort = regional EPP pool-aggregate scrape target
# (VPC-internal ILB; see k8s/region-*/metrics-ilb.yaml).
endpoints:
  - name: eu
    namespace: llmd-poc
    address: 34.13.255.134
    port: "80"
    labels:
      region: eu
      metricsAddress: 10.10.0.3
      metricsPort: "30090"
  - name: us
    namespace: llmd-poc
    address: 104.196.41.167
    port: "80"
    labels:
      region: us
      metricsAddress: 10.20.0.3
      metricsPort: "30090"

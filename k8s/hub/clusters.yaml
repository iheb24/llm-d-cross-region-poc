# Hub discovery file (DRAFT — reviewed at G1, first applied at P4).
# Consumed by the hub EPP's multicluster-file-discovery plugin (mounted at
# /etc/epp/clusters.yaml). Format: pkg/epp/framework/plugins/datalayer/discovery/file
# @ llm-d-router v1.0.0. Addresses may be RFC-1123 hostnames or IPs.
# watchFile: true in the EPP config hot-reloads this file (fsnotify), so failure
# injection and destination changes do not require an EPP restart.
endpoints:
  - name: eu
    namespace: llmd-poc
    # Regional gateway hostname (TBD at P2: reserved static IP + DNS).
    address: eu-gateway.llmd-poc.example.com
    port: "443"
    labels:
      region: eu
      # Pool-aggregate metrics are scraped from the regional EPP, which may live
      # behind a different host/port than the gateway (metricsHostFromLabels).
      metricsAddress: eu-epp-metrics.llmd-poc.example.com
      metricsPort: "443"
  - name: us
    namespace: llmd-poc
    address: us-gateway.llmd-poc.example.com
    port: "443"
    labels:
      region: us
      metricsAddress: us-epp-metrics.llmd-poc.example.com
      metricsPort: "443"

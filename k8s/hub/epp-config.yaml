# Hub EndpointPickerConfig (DRAFT — reviewed at G1, first applied at P4).
#
# Cluster-scoped EPP: candidates are regional gateways (see clusters.yaml), not pods.
# Basis: pkg/epp/framework/plugins/README.md "Multi-cluster variants" @ llm-d-router
# v1.0.0 (b9393d1a), extended with the cluster-scoped prefix-cache family.
#
# Deployment requirements (validated at P4):
#   - ALL multicluster-* plugins are StabilityAlpha @ v1.0.0
#     (cmd/epp/runner/runner.go L722–812) → EPP must run with
#     --allow-experimental-plugins (chart: router.epp flags).
#   - Start EPP with --emit-endpoint-scores so x-gateway-destination-endpoint-scores
#     metadata carries every candidate's score (request-correlation evidence).
#   - The metric scorers REQUIRE the source+extractor trio in dataLayer; a config
#     with scorers but no source/extractor fails to load (by design, #2287).
#   - Config swap = helm upgrade → EPP rollout restart (no in-place EPPConfig
#     reload; the discovery file itself hot-reloads via watchFile).
apiVersion: llm-d.ai/v1
kind: EndpointPickerConfig
plugins:
  - type: multicluster-file-discovery
    name: discovery
    parameters:
      path: /etc/epp/clusters.yaml
      watchFile: true
  - type: multicluster-metrics-data-source
    name: metrics-source
    parameters:
      scheme: https            # default; server cert verified (cross-cluster trust boundary)
      caCertPath: /etc/epp/tls/ca.crt
      clientCertPath: /etc/epp/tls/tls.crt   # mTLS client identity (B3)
      clientKeyPath: /etc/epp/tls/tls.key
      # interval: "5s"         # scrape period; rounded to --refresh-metrics-interval tick
  - type: multicluster-metrics-extractor
    name: metrics-extractor
    # defaults read llm_d_epp_average_kv_cache_utilization / llm_d_epp_average_queue_size
    # from each spoke EPP and write llm-d.ai/multicluster-* endpoint attributes
  - type: multicluster-session-affinity-filter
    name: session-affinity    # stock semantics: client identity via x-session-token header
  - type: multicluster-approx-prefix-cache-producer
    name: approx-prefix-producer
  - type: multicluster-prefix-cache-scorer
    name: prefix-cache
  - type: multicluster-kv-cache-utilization-scorer
    name: kv-cache
  - type: multicluster-queue-scorer
    name: queue               # min-max normalized: shortest queue=1, longest=0, equal=1
  - type: max-score-picker
  - type: single-profile-handler
dataLayer:
  discovery:
    endpoints:
      pluginRef: discovery
  sources:
    - pluginRef: metrics-source
      extractors:
        - pluginRef: metrics-extractor
# schedulingProfiles: default profile applies scorers above (weights validated
# against the v1.0.0 schema at P4 before first apply).
#
# --- T1 (deterministic forcing) variant -------------------------------------
# Per-test config applied via helm upgrade (A9; client request fields are NOT
# used — v1.0.0 strips client-supplied routing headers):
#   - add an endpoint-attribute/bylabel filter keeping only region=<eu|us>
#     (labels come from clusters.yaml), then re-run the request set.
#
# --- T2 (weighted routing) variant ------------------------------------------
#   - add endpoint-attribute-weight-scorer {attributeKey: region, producer: "",
#     weights: {eu: 8, us: 2}} and switch the picker to weighted-random-picker;
#     observed allocation converges to weights (validated statistically in T2).

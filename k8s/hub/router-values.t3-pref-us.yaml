# T3 hub policy: US preferred (real endpoint), EU secondary (sims).
# Preference via endpoint-attribute-weight-scorer {us: 2, eu: 1} (region label
# -> attribute via label-producer). Pressure via multicluster-queue-scorer and
# multicluster-kv-cache-utilization-scorer: when the US pool reports queue/KV
# pressure, its composite drops below EU and traffic overflows. max-score-picker
# keeps the preference deterministic while US is healthy.
provider:
  name: none

httpRoute:
  create: true
  inferenceGatewayName: llmd-hub-gateway
  requestTimeout: "300s"

router:
  modelServers:
    type: vllm
    protocol: http
    targetPorts:
      - number: 80
    matchLabels:
      app: llmd-hub-no-pods

  inferencePool:
    create: true
    failureMode: FailOpen

  monitoring:
    provider:
      name: gmp
      gmp:
        autopilot: false
    interval: "15s"
    prometheus:
      enabled: true
      auth:
        enabled: false

  epp:
    replicas: 1
    image:
      tag: "v1.0.0"
    resources:
      requests:
        cpu: "500m"
        memory: 1Gi
      limits:
        memory: 2Gi
    flags:
      v: 2
      emit-endpoint-scores: true
      allow-experimental-plugins: true
    volumes:
      - name: hub-clusters
        configMap:
          name: llmd-hub-clusters
    volumeMounts:
      - name: hub-clusters
        mountPath: /etc/epp
    pluginsConfig:
      apiVersion: llm-d.ai/v1
      kind: EndpointPickerConfig
      plugins:
        - type: multicluster-file-discovery
          name: discovery
          parameters:
            path: /etc/epp/clusters.yaml
            watchFile: true
        - type: multicluster-metrics-data-source
          name: metrics-source
          parameters:
            scheme: http
        - type: multicluster-metrics-extractor
          name: metrics-extractor
        - type: multicluster-session-affinity-filter
          name: session-affinity
        - type: label-producer
          name: endpoint-labels
          parameters:
            labels:
              - label: region
                attributeKey: region
        - type: endpoint-attribute-weight-scorer
          name: region-pref
          parameters:
            attributeKey: region
            producer: endpoint-labels
            weights:
              us: 2
              eu: 1
        - type: multicluster-queue-scorer
          name: queue
        - type: multicluster-kv-cache-utilization-scorer
          name: kv-cache
        - type: max-score-picker
        - type: single-profile-handler
      dataLayer:
        discovery:
          endpoints:
            pluginRef: discovery
        sources:
          - pluginRef: metrics-source
            extractors:
              - pluginRef: metrics-extractor
      schedulingProfiles:
        - name: default
          plugins:
            - pluginRef: session-affinity
            - pluginRef: region-pref
              weight: 1
            - pluginRef: queue
              weight: 1
            - pluginRef: kv-cache
              weight: 1

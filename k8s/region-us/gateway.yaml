# US regional gateway (Envoy AI Gateway provider). Bound to the reserved static
# IP from P2 via the GatewayClass EnvoyProxy (region-us/envoyproxy.yaml) —
# Gateway spec.addresses does NOT work on GKE (externalIPs denied).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: llm-d-inference-gateway
  namespace: llmd-serving
spec:
  gatewayClassName: envoy-ai-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
# Envoy Gateway's default 32kiB buffer is too small for AI workloads (llm-d recipe).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: client-buffer-limit
  namespace: llmd-serving
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm-d-inference-gateway
  connection:
    bufferLimit: 50Mi

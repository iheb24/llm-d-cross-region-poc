# T3 pressure source (US pool): an inference-sim that reports FAKE waiting-queue
# metrics (vllm:num_requests_waiting), ramped at runtime via /admin/config.
# Labeled app=llmd-vllm so it joins the US InferencePool — the regional EPP's
# average_queue_size then reflects the ramp, and the hub's multicluster
# queue-scorer sees real pressure from the US region.
# It also serves requests (real model name) so hub traffic to US still gets 200s.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmd-pressure-sim
  namespace: llmd-serving
  labels:
    app: llmd-pressure-sim
spec:
  replicas: 0   # T3-only tooling: scale to 1 during T3, 0 otherwise (regional cache tests must not land on it)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llmd-pressure-sim
  template:
    metadata:
      labels:
        app: llmd-pressure-sim   # matches the Deployment selector
        app-role: pressure-sim
        llmd-pool: vllm          # joins the regional InferencePool (see note)
    spec:
      containers:
        - name: vllm-sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0
          imagePullPolicy: IfNotPresent
          args:
            - "--model"
            - "Qwen/Qwen2.5-Coder-14B-Instruct-AWQ"
            - "--port"
            - "8000"
            - "--max-model-len=8192"
            # fake-metrics mode must be ON at startup (runtime /admin/config
            # updates are refused otherwise); start idle at zero.
            - '--fake-metrics'
            - '{"waiting-requests":0,"running-requests":0,"kv-cache-usage":0}'
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5

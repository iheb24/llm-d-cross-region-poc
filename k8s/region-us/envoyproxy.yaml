# US: bind the regional gateway's Envoy Service to the reserved static IP.
# See region-eu/envoyproxy.yaml for why (GKE denies externalIPs).
# NOTE: the hub gateway (146.148.64.26) is bound at P4 when the hub is deployed.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: poc-proxy-config
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        patch:
          type: StrategicMerge
          value:
            spec:
              loadBalancerIP: 34.74.158.67
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-ai-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: poc-proxy-config
    namespace: envoy-gateway-system
